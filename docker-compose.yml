services:
  # 1. Database
  db:
    image: postgres:16-alpine
    # ... baaki same
  # 2. Cache
  redis:
    image: redis:7-alpine
    # ... baaki same
  # 3. FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    # ... baaki same
  # 4. LiveKit Agent (Worker)
  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ... baaki same
  # 5. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    # ... baaki same

volumes:
  pgdata: